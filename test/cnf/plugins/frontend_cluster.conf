user = "admin";
password = "admin"; # No need to use real password in test config, just use "admin"

backend:
{
        # Deliberately short. RunClusterTests stalls a backend and waits for the
        # frontend to give up on it, and the queries it makes take milliseconds,
        # so there is no reason to wait the production 20 minutes for that.
        # RunClusterTests.cpp knows this value - keep the two in step.
        timeout = 8;
        threads = 10;
};
